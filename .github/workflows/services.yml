name: Service conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rewind-fixture
          POSTGRES_DB: rewind
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0.31
        env:
          MYSQL_ROOT_PASSWORD: rewind-fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: rewind
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -prewind-fixture" --health-interval 5s
          --health-timeout 5s --health-retries 30
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:59092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
        ports:
          - 59092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Real PostgreSQL, MySQL, Kafka and Celery conformance
        run: python -m pytest tests/test_postgres.py tests/test_mysql.py tests/test_kafka.py tests/test_celery.py -q
        env:
          REWIND_RELATIONAL_CONFORMANCE: '1'
          REWIND_KAFKA_BOOTSTRAP: 127.0.0.1:59092
      - name: Synthetic staging and rollback budgets
        run: >-
          python scripts/validate_deployment.py --profile docs/validation/local-staging.json
          --output deployment-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-validation
          path: deployment-validation.json
