name: Package release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tag to TestPyPI, verify it, then promote to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  service-conformance:
    uses: ./.github/workflows/services.yml
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate release identity and main ancestry
        run: |
          python scripts/check_release.py --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -e '.[dev]'
      - name: Validate earlier supported adapter families on Python 3.11
        if: matrix.python-version == '3.11'
        run: python -m pip install 'sqlalchemy>=2.0,<2.1' 'redis>=5,<6' 'flask>=3.0,<3.1'
      - run: ruff check src tests examples scripts
      - run: mypy src/rewind
      - run: python -m pytest -q

  offline:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify_offline.sh

  redis-conformance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_redis.py -q
        env:
          REWIND_REDIS_CONFORMANCE: '1'

  build:
    needs: [validate, offline, redis-conformance, service-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[release]'
      - run: python -m build
      - run: python scripts/verify_distribution.py dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  testpypi:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: expected/
      - name: Fetch the staged wheel and compare its bytes
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --no-deps --only-binary=:all: --retries 2 \
              --index-url https://test.pypi.org/simple/ --dest downloaded "jaysoft-rewind==$version"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          python - <<'PY'
          from pathlib import Path
          expected = next(Path("expected").glob("*.whl"))
          actual = Path("downloaded") / expected.name
          assert actual.read_bytes() == expected.read_bytes(), "staged wheel differs from build"
          PY
      - name: Install and check the staged wheel without project source
        run: |
          python -m pip install --no-deps downloaded/*.whl
          python -I -c 'from rewind import BackgroundWriter, Rewind; assert hasattr(Rewind, "aclose")'
          rewind --version

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
