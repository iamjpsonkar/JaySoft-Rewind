name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev,release]'
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Check types
        run: mypy src/rewind
      - name: Test
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Check distribution contents and isolated wheel import
        run: python scripts/verify_distribution.py dist
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Exercise benchmark and bounded retention storm
        run: >-
          python -m scripts.benchmark_capture --iterations 8 --warmup 2 --repeats 2
          --concurrency 2 --queue-items 4 --queue-bytes 65536
          --output benchmark-smoke.json
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify replay without external networking
        run: ./scripts/verify_offline.sh
