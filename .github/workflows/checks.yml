name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev,release]'
      - name: Check earlier supported adapter families on Python 3.11
        if: matrix.python-version == '3.11'
        run: python -m pip install 'sqlalchemy>=2.0,<2.1' 'redis>=5,<6' 'flask>=3.0,<3.1'
      - name: Record resolved dependency versions
        run: python -m pip list --format=json > dependency-versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-versions-${{ matrix.python-version }}
          path: dependency-versions.json
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Check types
        run: mypy src/rewind
      - name: Test
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Check distribution contents and isolated wheel import
        run: python scripts/verify_distribution.py dist
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Exercise benchmark and bounded retention storm
        run: >-
          python -m scripts.benchmark_capture --iterations 8 --warmup 2 --repeats 2
          --concurrency 2 --queue-items 4 --queue-bytes 65536
          --output benchmark-smoke.json
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify replay without external networking
        run: ./scripts/verify_offline.sh
  redis-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -e '.[dev]'
      - name: Verify real Redis through isolated Unix sockets
        run: python -m pytest tests/test_redis.py -q
        env:
          REWIND_REDIS_CONFORMANCE: '1'
